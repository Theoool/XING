[project]
name = "xing"
version = "0.1.0"
description = "AIXING — content intelligence platform"
readme = "README.md"
authors = [
    { name = "qinzihao", email = "2580456922@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "openai>=3.59.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "pydantic-settings>=2.6.0",
    "pgvector>=0.3.6",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "watchfiles>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"
